<!doctype html>
<html lang="pt-BR" class="sge-acesso-pendente">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatórios · SGE</title>
<link rel="icon" href="https://grupogps-mecanizada.github.io/sge-core/v1/assets/sge-logo.svg">
<link rel="stylesheet" href="https://grupogps-mecanizada.github.io/sge-core/v1/sge-core.css">
<link rel="stylesheet" href="css/relatorios.css">
</head>
<body class="sge">
<main class="rel">
  <header class="rel-topo">
    <h1>Relatórios</h1>
    <p class="rel-sub">Tudo o que o departamento de Apresentações já entregou.</p>
    <label class="rel-busca">
      <span class="sr">Buscar relatório</span>
      <input id="busca" type="search" placeholder="Buscar por título, tema ou equipamento" autocomplete="off">
    </label>
  </header>

  <nav class="rel-filtros" aria-label="Filtros">
    <div class="rel-linha" id="filtro-setor" role="group" aria-label="Setor"></div>
    <div class="rel-linha" id="filtro-tema" role="group" aria-label="Tema"></div>
  </nav>

  <p class="rel-contagem" id="contagem" aria-live="polite"></p>
  <section id="lista" class="rel-lista" aria-busy="true">
    <p class="rel-vazio">Carregando relatórios…</p>
  </section>
</main>

<div class="rel-visor" id="visor" hidden>
  <div class="rel-visor-barra">
    <button type="button" class="rel-btn" id="visor-fechar">← Voltar</button>
    <strong id="visor-titulo"></strong>
    <a class="rel-btn" id="visor-baixar" download>Baixar</a>
  </div>
  <iframe id="visor-quadro" title="Relatório" sandbox="allow-scripts allow-popups"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://grupogps-mecanizada.github.io/sge-core/v1/sge-core.js"></script>
<script src="js/dados.js"></script>
<script src="js/lista.js"></script>
<script src="js/visor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
