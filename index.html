<!doctype html>
<html lang="pt-BR" class="sge-acesso-pendente">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatórios · SGE</title>
<link rel="icon" href="/sge-core-/v1/assets/sge-logo.svg">
<link rel="stylesheet" href="/sge-core-/v1/sge-core.css">
<link rel="stylesheet" href="css/relatorios.css">
</head>
<body class="sge">
<main class="rel">
  <header class="rel-topo">
    <h1>Relatórios</h1>
    <!-- Abas em cascata: setor (grande) → tema do setor escolhido -->
    <div class="rel-abas rel-abas-grande" id="abas-setor" role="tablist" aria-label="Setor"></div>
  </header>
  <div class="rel-abas" id="abas-tema" role="tablist" aria-label="Tema"></div>

  <p class="rel-numeros" id="numeros" aria-live="polite"></p>

  <div class="rel-filtros" role="group" aria-label="Filtros">
    <label class="rel-pilula rel-ativa">
      <span class="rel-suave">Período</span>
      <select id="periodo" aria-label="Período">
        <option value="tudo">Tudo</option>
        <option value="mes">Este mês</option>
        <option value="3m">Últimos 3 meses</option>
        <option value="ano">Este ano</option>
      </select>
      <span class="rel-suave" aria-hidden="true">▾</span>
    </label>
    <span id="pilulas"></span>
    <div class="rel-mais" id="mais-filtro">
      <button type="button" class="rel-pilula rel-tracejada" id="mais-filtro-botao" aria-haspopup="menu" aria-expanded="false">+ Filtro</button>
      <div class="rel-menu" id="mais-filtro-menu" role="menu" hidden></div>
    </div>
    <input id="busca" class="rel-busca" type="search" aria-label="Buscar" placeholder="Buscar título, equipamento, resumo…" autocomplete="off">
  </div>

  <div class="rel-corpo" id="corpo">
    <section class="rel-lista" aria-label="Lista de relatórios">
      <table class="rel-tabela">
        <thead>
          <tr>
            <th class="col-data">Data</th>
            <th>Relatório</th>
            <th class="col-tema">Tema</th>
            <th class="col-setor">Setor</th>
            <th class="col-para">Para quem</th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
      <p class="rel-vazio" id="vazio">Carregando relatórios…</p>
    </section>
    <aside class="rel-detalhe" id="detalhe" aria-label="Detalhe do relatório" hidden></aside>
  </div>
</main>

<div class="rel-visor" id="visor" hidden>
  <div class="rel-visor-barra">
    <button type="button" class="rel-btn" id="visor-fechar">← Voltar</button>
    <strong id="visor-titulo"></strong>
    <a class="rel-btn" id="visor-baixar" download>Baixar</a>
  </div>
  <iframe id="visor-quadro" title="Relatório" sandbox="allow-scripts allow-popups"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/sge-core-/v1/sge-core.js"></script>
<script src="js/dados.js"></script>
<script src="js/lista.js"></script>
<script src="js/visor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
